
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InsightForge – Turn Raw Data Into Decisions</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js for visualizations -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- PapaParse for CSV reading -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header class="header">
    <div class="logo">
      <span class="logo-icon">🚀</span>
      <span class="logo-text">InsightForge</span>
    </div>
    <p class="tagline">Turn Raw Data Into Decisions</p>
  </header>

  <!-- ========== MAIN LAYOUT ========== -->
  <main class="container">

    <!-- Upload Section -->
    <section class="card upload-section">
      <h2>Upload Dataset</h2>
      <p class="subtitle">Supports CSV files</p>
      <input type="file" id="fileInput" accept=".csv" />
      <div id="fileInfo" class="file-info"></div>
    </section>

    <!-- Dataset Overview -->
    <section class="card" id="overviewSection" style="display: none;">
      <h2>Dataset Overview</h2>
      <div class="stats-grid" id="statsGrid"></div>
    </section>

    <!-- Data Preview -->
    <section class="card" id="previewSection" style="display: none;">
      <h2>Data Preview</h2>
      <div class="table-wrapper">
        <table id="dataTable"></table>
      </div>
    </section>

    <!-- Charts Section -->
    <section class="card" id="chartsSection" style="display: none;">
      <h2>Visualizations</h2>
      <div class="chart-controls">
        <select id="columnSelect"></select>
        <select id="chartType">
          <option value="bar">Bar Chart</option>
          <option value="line">Line Chart</option>
          <option value="pie">Pie Chart</option>
        </select>
        <button id="generateChartBtn">Generate Chart</button>
      </div>
      <canvas id="mainChart"></canvas>
    </section>

    <!-- Insights Section -->
    <section class="card" id="insightsSection" style="display: none;">
      <h2>Key Insights</h2>
      <div id="insightsList"></div>
    </section>

  </main>

  <footer class="footer">
    <p>InsightForge • Built with transparency</p>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
