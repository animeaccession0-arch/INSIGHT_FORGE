<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InsightForge – Turn Raw Data Into Decisions</title>
  <meta name="description" content="A transparent AI-powered data intelligence platform that turns raw data into analysis, visualizations, insights and decisions." />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header class="header">
    <div class="header-top">
      <div class="logo">
        <span class="logo-icon">🚀</span>
        <h1 class="logo-text" data-i18n="app.title">InsightForge</h1>
      </div>

      <!-- Language Switcher -->
      <div class="language-switcher">
        <label for="languageSelect" data-i18n="lang.label">Language</label>
        <select id="languageSelect">
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
          <option value="ja">日本語</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="pt">Português</option>
          <option value="ru">Русский</option>
          <option value="zh">中文</option>
          <option value="ko">한국어</option>
          <option value="ar">العربية</option>
          <option value="tr">Türkçe</option>
          <option value="it">Italiano</option>
          <option value="id">Bahasa Indonesia</option>
          <option value="vi">Tiếng Việt</option>
          <option value="nl">Nederlands</option>
          <option value="pl">Polski</option>
          <option value="th">ไทย</option>
          <option value="bn">বাংলা</option>
          <option value="ur">اردو</option>
          <option value="ms">Bahasa Melayu</option>
          <option value="sv">Svenska</option>
          <option value="uk">Українська</option>
          <option value="el">Ελληνικά</option>
          <option value="ta">தமிழ்</option>
          <option value="te">తెలుగు</option>
          <option value="fa">فارسی</option>
          <option value="he">עברית</option>
          <option value="ro">Română</option>
          <option value="cs">Čeština</option>
          <option value="hu">Magyar</option>
          <option value="fi">Suomi</option>
          <option value="da">Dansk</option>
          <option value="no">Norsk</option>
          <option value="sk">Slovenčina</option>
          <option value="bg">Български</option>
          <option value="hr">Hrvatski</option>
          <option value="sr">Српски</option>
          <option value="sl">Slovenščina</option>
          <option value="lt">Lietuvių</option>
          <option value="lv">Latviešu</option>
          <option value="et">Eesti</option>
          <option value="tl">Filipino</option>
          <option value="sw">Kiswahili</option>
          <option value="af">Afrikaans</option>
          <option value="ca">Català</option>
          <option value="sq">Shqip</option>
          <option value="mk">Македонски</option>
          <option value="ka">ქართული</option>
          <option value="hy">Հայերեն</option>
          <option value="is">Íslenska</option>
          <option value="eu">Euskara</option>
          <option value="gl">Galego</option>
          <option value="be">Беларуская</option>
          <option value="kk">Қазақша</option>
          <option value="az">Azərbaycan</option>
          <option value="mn">Монгол</option>
        </select>
      </div>
    </div>

    <p class="tagline" data-i18n="app.tagline">Turn Raw Data Into Decisions</p>
  </header>

  <!-- ========== MAIN ========== -->
  <main class="container">

    <!-- Upload Section -->
    <section class="card">
      <h2 data-i18n="upload.title">Upload Dataset</h2>
      <p class="subtitle" data-i18n="upload.subtitle">Upload a CSV file to begin analysis</p>
      <input type="file" id="fileInput" accept=".csv" />
      <div id="fileInfo" class="file-info"></div>
    </section>

    <!-- Overview -->
    <section class="card" id="overviewSection" hidden>
      <h2 data-i18n="overview.title">Dataset Overview</h2>
      <div class="stats-grid" id="statsGrid"></div>
    </section>

    <!-- Preview -->
    <section class="card" id="previewSection" hidden>
      <h2 data-i18n="preview.title">Data Preview</h2>
      <div class="table-wrapper">
        <table id="dataTable"></table>
      </div>
    </section>

    <!-- Charts -->
    <section class="card" id="chartsSection" hidden>
      <h2 data-i18n="charts.title">Visualizations</h2>
      <div class="chart-controls">
        <select id="columnSelect"></select>
        <select id="chartType">
          <option value="bar" data-i18n="charts.bar">Bar Chart</option>
          <option value="line" data-i18n="charts.line">Line Chart</option>
          <option value="pie" data-i18n="charts.pie">Pie Chart</option>
          <option value="doughnut" data-i18n="charts.doughnut">Doughnut Chart</option>
        </select>
        <button id="generateChartBtn" data-i18n="charts.generate">Generate Chart</button>
      </div>
      <div class="chart-container">
        <canvas id="mainChart"></canvas>
      </div>
    </section>

    <!-- Insights -->
    <section class="card" id="insightsSection" hidden>
      <h2 data-i18n="insights.title">Key Insights</h2>
      <div id="insightsList"></div>
    </section>

  </main>

  <footer class="footer">
    <p data-i18n="footer.text">InsightForge • Built with transparency and purpose</p>
  </footer>

  <!-- Scripts -->
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Initialize language system
    document.addEventListener('DOMContentLoaded', () => {
      I18n.init();

      const languageSelect = document.getElementById('languageSelect');
      
      // Set current language in dropdown
      languageSelect.value = I18n.getCurrentLanguage();

      // Change language when user selects
      languageSelect.addEventListener('change', (e) => {
        I18n.setLanguage(e.target.value);
      });
    });
  </script>
</body>
</html>
