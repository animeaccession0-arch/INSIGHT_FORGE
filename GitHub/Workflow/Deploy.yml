name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd insight-forge.react && npm install
      - run: cd insight-forge.react && npm run build
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
          path: insight-forge.react/dist
