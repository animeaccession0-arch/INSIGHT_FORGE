<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Space Explorer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000005;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    canvas {
      display: block;
    }

    /* ---------- Loading ---------- */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000005;
      color: #7fb8d9;
      font-size: 14px;
      letter-spacing: 3px;
      z-index: 100;
      transition: opacity 0.6s ease;
    }

    /* ---------- Navigation ---------- */
    #navBar {
      position: fixed;
      top: 14px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 20;
      padding: 0 12px;
    }

    .nav-btn {
      background: rgba(12, 14, 28, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px);
      color: #9fd3e8;
      font-size: 12px;
      letter-spacing: 0.6px;
      padding: 9px 16px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .nav-btn:hover {
      background: rgba(110, 231, 255, 0.12);
      border-color: rgba(110, 231, 255, 0.4);
    }

    .nav-btn.active {
      background: rgba(110, 231, 255, 0.2);
      border-color: rgba(110, 231, 255, 0.7);
      color: #ffffff;
    }

    /* ---------- Overlay Title ---------- */
    #overlay {
      position: fixed;
      top: 64px;
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
      z-index: 15;
      color: #eaf6ff;
    }

    #overlay h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-shadow: 0 0 24px rgba(80, 200, 255, 0.55);
      margin-bottom: 4px;
    }

    #overlay p {
      font-size: 11px;
      color: #7fb8d9;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* ---------- Shape Label ---------- */
    #shapeLabel {
      position: fixed;
      bottom: 26px;
      left: 0;
      right: 0;
      text-align: center;
      color: #6ee7ff;
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.9;
      z-index: 15;
      pointer-events: none;
      text-shadow: 0 0 14px rgba(100, 220, 255, 0.6);
    }

    /* ---------- Color Panel ---------- */
    #colorPanel {
      position: fixed;
      top: 130px;
      right: 14px;
      z-index: 15;
      background: rgba(10, 12, 24, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 16px;
      backdrop-filter: blur(14px);
      padding: 12px 14px;
      color: #fff;
      user-select: none;
    }

    .cp-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .cp-row label {
      font-size: 11px;
      opacity: 0.85;
      min-width: 36px;
    }

    .cp-row input[type="color"] {
      width: 36px;
      height: 24px;
      border: none;
      border-radius: 6px;
      background: none;
      cursor: pointer;
      padding: 0;
    }

    .cp-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .cp-swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .cp-swatch:active {
      transform: scale(0.88);
    }

    /* ---------- Planet Menu ---------- */
    #planetMenu {
      position: fixed;
      top: 130px;
      left: 12px;
      z-index: 15;
      background: rgba(10, 12, 24, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 16px;
      backdrop-filter: blur(14px);
      padding: 8px;
      max-height: 55vh;
      overflow-y: auto;
      display: none;
    }

    .planet-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      background: none;
      border: none;
      color: #cfeaf5;
      font-size: 12.5px;
      padding: 7px 10px;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s ease;
    }

    .planet-btn:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .planet-btn.active {
      background: rgba(110, 231, 255, 0.18);
      color: #fff;
    }

    .planet-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 7px currentColor;
    }

    /* ---------- Planet Info ---------- */
    #planetInfo {
      position: fixed;
      bottom: 20px;
      left: 14px;
      right: 14px;
      z-index: 15;
      background: rgba(10, 12, 24, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 16px;
      backdrop-filter: blur(14px);
      padding: 14px 18px;
      color: #eaf6ff;
      display: none;
    }

    #planetInfo h2 {
      font-size: 17px;
      margin-bottom: 2px;
    }

    #planetInfo .au {
      font-size: 11px;
      color: #7fb8d9;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    #planetInfo p {
      font-size: 13px;
      line-height: 1.45;
      color: #d8ecf5;
    }
  </style>
</head>

<body>
  <div id="loading">LOADING SPACE…</div>

  <div id="navBar">
    <button class="nav-btn active" data-mode="galaxy">Galaxy</button>
    <button class="nav-btn" data-mode="blackhole">Black Hole</button>
    <button class="nav-btn" data-mode="planets">Solar System</button>
  </div>

  <div id="overlay">
    <h1 id="overlayTitle">Space Explorer</h1>
    <p id="overlaySub">Drag to rotate · Scroll to zoom</p>
  </div>

  <div id="shapeLabel">Spiral Galaxy</div>

  <div id="colorPanel">
    <div class="cp-row">
      <label>Core</label>
      <input type="color" id="cpCore" value="#ffffff" />
    </div>
    <div class="cp-row">
      <label>Glow</label>
      <input type="color" id="cpMid" value="#6ee7ff" />
    </div>
    <div class="cp-row">
      <label>Edge</label>
      <input type="color" id="cpEdge" value="#1450a8" />
    </div>
    <div class="cp-presets">
      <button class="cp-swatch" style="background:linear-gradient(90deg,#fff,#6ee7ff,#1450a8)" data-core="#ffffff" data-mid="#6ee7ff" data-edge="#1450a8"></button>
      <button class="cp-swatch" style="background:linear-gradient(90deg,#fff,#ff6ec7,#7a0e6e)" data-core="#ffffff" data-mid="#ff6ec7" data-edge="#7a0e6e"></button>
      <button class="cp-swatch" style="background:linear-gradient(90deg,#fff,#b388ff,#3a0ca3)" data-core="#ffffff" data-mid="#b388ff" data-edge="#3a0ca3"></button>
      <button class="cp-swatch" style="background:linear-gradient(90deg,#fff,#ffd166,#a85200)" data-core="#ffffff" data-mid="#ffd166" data-edge="#a85200"></button>
      <button class="cp-swatch" style="background:linear-gradient(90deg,#fff,#6effa3,#0a6e3a)" data-core="#ffffff" data-mid="#6effa3" data-edge="#0a6e3a"></button>
      <button class="cp-swatch" style="background:linear-gradient(90deg,#fff,#ff6e6e,#7a0e0e)" data-core="#ffffff" data-mid="#ff6e6e" data-edge="#7a0e0e"></button>
    </div>
  </div>

  <div id="planetMenu"></div>

  <div id="planetInfo">
    <h2 id="piName">—</h2>
    <div class="au" id="piAu">—</div>
    <p id="piFact">—</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // ===================== SCENE SETUP =====================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 400);
    camera.position.set(0, 3.2, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000001);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = false;
    controls.minDistance = 1.5;
    controls.maxDistance = 60;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.4;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.4, 0.35);
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    scene.add(new THREE.AmbientLight(0x223355, 1.1));
    const sunLight = new THREE.PointLight(0xfff2cc, 3.2, 60, 1.6);
    scene.add(sunLight);

    // ===================== SPRITES =====================
    function createSprite(sharp = false) {
      const size = 64;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
      if (sharp) {
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.5, 'rgba(255,255,255,0.65)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
      } else {
        gradient.addColorStop(0, 'rgba(255,255,255,0.85)');
        gradient.addColorStop(0.35, 'rgba(255,255,255,0.35)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
      }
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(canvas);
    }

    const softSprite = createSprite(false);
    const sharpSprite = createSprite(true);

    // ===================== STARFIELD =====================
    function createStarfield() {
      // Dim stars
      const dimCount = 9000;
      const dimPos = new Float32Array(dimCount * 3);
      for (let i = 0; i < dimCount; i++) {
        const r = 50 + Math.random() * 150;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        dimPos[i*3]     = r * Math.sin(phi) * Math.cos(theta);
        dimPos[i*3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        dimPos[i*3 + 2] = r * Math.cos(phi);
      }
      const dimGeo = new THREE.BufferGeometry();
      dimGeo.setAttribute('position', new THREE.BufferAttribute(dimPos, 3));
      scene.add(new THREE.Points(dimGeo, new THREE.PointsMaterial({
        size: 0.028, map: softSprite, transparent: true, depthWrite: false,
        color: 0xbfe0f2, opacity: 0.75, blending: THREE.AdditiveBlending, sizeAttenuation: true
      })));

      // Bright stars
      const brightCount = 500;
      const brightPos = new Float32Array(brightCount * 3);
      for (let i = 0; i < brightCount; i++) {
        const r = 45 + Math.random() * 140;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        brightPos[i*3]     = r * Math.sin(phi) * Math.cos(theta);
        brightPos[i*3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        brightPos[i*3 + 2] = r * Math.cos(phi);
      }
      const brightGeo = new THREE.BufferGeometry();
      brightGeo.setAttribute('position', new THREE.BufferAttribute(brightPos, 3));
      scene.add(new THREE.Points(brightGeo, new THREE.PointsMaterial({
        size: 0.09, map: softSprite, transparent: true, depthWrite: false,
        color: 0xffffff, opacity: 0.9, blending: THREE.AdditiveBlending, sizeAttenuation: true
      })));
    }
    createStarfield();

    // ===================== GALAXY MODE =====================
    const GALAXY_COUNT = 40000;
    let colorCore = new THREE.Color(0xffffff);
    let colorMid  = new THREE.Color(0x6ee7ff);
    let colorEdge = new THREE.Color(0x1450a8);

    function colorForT(t) {
      return t < 0.5
        ? colorCore.clone().lerp(colorMid, t * 2)
        : colorMid.clone().lerp(colorEdge, (t - 0.5) * 2);
    }

    function buildGalaxy(n) {
      const positions = new Float32Array(n * 3);
      const colors    = new Float32Array(n * 3);
      const tVals     = new Float32Array(n);
      const branches = 4, radius = 5.2, spin = 1.6, randomness = 0.32, power = 2.6;

      for (let i = 0; i < n; i++) {
        const r = Math.pow(Math.random(), 0.7) * radius;
        const branchAngle = ((i % branches) / branches) * Math.PI * 2;
        const spinAngle = r * spin;
        const rand = () => Math.pow(Math.random(), power) * (Math.random() < 0.5 ? 1 : -1);

        const angle = branchAngle + spinAngle;
        positions[i*3]     = Math.cos(angle) * r + rand() * randomness * r;
        positions[i*3 + 1] = rand() * randomness * r * 0.25;
        positions[i*3 + 2] = Math.sin(angle) * r + rand() * randomness * r;

        const t = r / radius;
        tVals[i] = t;
        const col = colorForT(t);
        colors[i*3] = col.r; colors[i*3+1] = col.g; colors[i*3+2] = col.b;
      }
      return { positions, colors, tVals };
    }

    function buildOrbJets(n) {
      const positions = new Float32Array(n * 3);
      const colors    = new Float32Array(n * 3);
      const tVals     = new Float32Array(n);
      const jetCount = Math.floor(n * 0.35);
      const sphereCount = n - jetCount;

      for (let i = 0; i < n; i++) {
        let x, y, z, t;
        if (i < sphereCount) {
          const rad = 0.6 + Math.random() * 0.7;
          const theta = 2 * Math.PI * Math.random();
          const phi = Math.acos(2 * Math.random() - 1);
          x = rad * Math.sin(phi) * Math.cos(theta);
          y = rad * Math.sin(phi) * Math.sin(theta) * 0.4;
          z = rad * Math.cos(phi);
          t = rad / 1.3;
        } else {
          const side = (i % 2 === 0) ? 1 : -1;
          const along = Math.pow(Math.random(), 1.8) * 4.6;
          x = (0.04 + along * 0.05) * (Math.random() - 0.5) * 2;
          y = side * (0.6 + along);
          z = (0.04 + along * 0.05) * (Math.random() - 0.5) * 2;
          t = Math.min(along / 4.6, 1);
        }
        positions[i*3] = x; positions[i*3+1] = y; positions[i*3+2] = z;
        tVals[i] = t;
        const col = colorForT(t);
        colors[i*3] = col.r; colors[i*3+1] = col.g; colors[i*3+2] = col.b;
      }
      return { positions, colors, tVals };
    }

    function buildTorusKnot(n) {
      const positions = new Float32Array(n * 3);
      const colors    = new Float32Array(n * 3);
      const tVals     = new Float32Array(n);
      const p = 2, q = 3, R = 3.4, r = 1.1, tube = 0.22;

      for (let i = 0; i < n; i++) {
        const u = Math.random() * Math.PI * 2;
        const cx = (R + r * Math.cos(q * u)) * Math.cos(p * u);
        const cy = (R + r * Math.cos(q * u)) * Math.sin(p * u);
        const cz = r * Math.sin(q * u);

        positions[i*3]     = cx + (Math.random() - 0.5) * tube;
        positions[i*3 + 1] = cz + (Math.random() - 0.5) * tube;
        positions[i*3 + 2] = cy + (Math.random() - 0.5) * tube;

        const t = Math.sin(q * u) * 0.5 + 0.5;
        tVals[i] = t;
        const col = colorForT(t);
        colors[i*3] = col.r; colors[i*3+1] = col.g; colors[i*3+2] = col.b;
      }
      return { positions, colors, tVals };
    }

    const GALAXY_SHAPES = [
      { name: 'Spiral Galaxy',   data: buildGalaxy(GALAXY_COUNT) },
      { name: 'Collapsing Star', data: buildOrbJets(GALAXY_COUNT) },
      { name: 'Torus Knot',     data: buildTorusKnot(GALAXY_COUNT) }
    ];

    const galaxyGeometry = new THREE.BufferGeometry();
    const galaxyLivePositions = new Float32Array(GALAXY_SHAPES[0].data.positions);
    const galaxyLiveColors    = new Float32Array(GALAXY_SHAPES[0].data.colors);
    galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(galaxyLivePositions, 3));
    galaxyGeometry.setAttribute('color',    new THREE.BufferAttribute(galaxyLiveColors, 3));

    const galaxyMaterial = new THREE.PointsMaterial({
      size: 0.022, map: sharpSprite, vertexColors: true, transparent: true,
      opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
    });

    const galaxyPoints = new THREE.Points(galaxyGeometry, galaxyMaterial);
    scene.add(galaxyPoints);

    let galCurrent = 0, galNext = 1, galMorphing = false, galMorphT = 0;
    const GAL_MORPH_DURATION = 2.2, GAL_HOLD_DURATION = 3.2;
    let galHoldTimer = GAL_HOLD_DURATION;
    const shapeLabel = document.getElementById('shapeLabel');

    function easeInOutCubic(x) {
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }

    function startGalaxyMorph() {
      galMorphing = true;
      galMorphT = 0;
      galNext = (galCurrent + 1) % GALAXY_SHAPES.length;
      shapeLabel.textContent = GALAXY_SHAPES[galNext].name;
    }

    function regenerateGalaxyColors() {
      for (const shape of GALAXY_SHAPES) {
        const { colors, tVals } = shape.data;
        for (let i = 0; i < GALAXY_COUNT; i++) {
          const col = colorForT(tVals[i]);
          colors[i*3] = col.r; colors[i*3+1] = col.g; colors[i*3+2] = col.b;
        }
      }
      galaxyLiveColors.set(GALAXY_SHAPES[galCurrent].data.colors);
      galaxyGeometry.attributes.color.needsUpdate = true;
    }

    function updateGalaxy(dt) {
      if (galMorphing) {
        galMorphT += dt / GAL_MORPH_DURATION;
        const e = easeInOutCubic(Math.min(galMorphT, 1));
        const from = GALAXY_SHAPES[galCurrent].data;
        const to   = GALAXY_SHAPES[galNext].data;

        for (let i = 0; i < GALAXY_COUNT * 3; i++) {
          galaxyLivePositions[i] = from.positions[i] + (to.positions[i] - from.positions[i]) * e;
          galaxyLiveColors[i]    = from.colors[i]    + (to.colors[i]    - from.colors[i])    * e;
        }
        galaxyGeometry.attributes.position.needsUpdate = true;
        galaxyGeometry.attributes.color.needsUpdate = true;

        if (galMorphT >= 1) {
          galMorphing = false;
          galCurrent = galNext;
          galHoldTimer = GAL_HOLD_DURATION;
        }
      } else {
        galHoldTimer -= dt;
        if (galHoldTimer <= 0) startGalaxyMorph();
      }
      galaxyPoints.rotation.y += dt * 0.05;
    }

    // ===================== BLACK HOLE =====================
    const blackholeGroup = new THREE.Group();
    const horizon = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0x000000 })
    );
    blackholeGroup.add(horizon);

    const DISK_COUNT = 16000;
    const diskRadius = new Float32Array(DISK_COUNT);
    const diskAngle0 = new Float32Array(DISK_COUNT);
    const diskSpeed  = new Float32Array(DISK_COUNT);
    const diskHeight = new Float32Array(DISK_COUNT);
    const diskColors = new Float32Array(DISK_COUNT * 3);
    const diskPositions = new Float32Array(DISK_COUNT * 3);

    const diskInner = new THREE.Color(0xfff8e0);
    const diskMid   = new THREE.Color(0xff8a2e);
    const diskOuter = new THREE.Color(0x8a1010);
    const CORE_COUNT = Math.floor(DISK_COUNT * 0.4);

    for (let i = 0; i < DISK_COUNT; i++) {
      let rr, angle0, height, t;
      if (i < CORE_COUNT) {
        rr = 0.28 + Math.pow(Math.random(), 1.6) * 1.6;
        angle0 = Math.random() * Math.PI * 2;
        height = (Math.random() - 0.5) * 0.1;
        t = rr / 1.9;
      } else {
        rr = 1.5 + Math.pow(Math.random(), 0.75) * 7.5;
        const branchAngle = ((i % 2) / 2) * Math.PI * 2;
        const spinAngle = rr * 2.4 * 0.18;
        angle0 = branchAngle + spinAngle + (Math.pow(Math.random(), 2) * (Math.random() < 0.5 ? 1 : -1)) * 0.55;
        height = (Math.random() - 0.5) * (0.04 + rr * 0.05);
        t = Math.min((rr - 1.5) / 7.5, 1);
      }
      diskRadius[i] = rr;
      diskAngle0[i] = angle0;
      diskSpeed[i]  = 1.3 / Math.sqrt(rr);
      diskHeight[i] = height;

      const col = t < 0.5 ? diskInner.clone().lerp(diskMid, t * 2) : diskMid.clone().lerp(diskOuter, (t - 0.5) * 2);
      diskColors[i*3] = col.r; diskColors[i*3+1] = col.g; diskColors[i*3+2] = col.b;
    }

    const diskGeometry = new THREE.BufferGeometry();
    diskGeometry.setAttribute('position', new THREE.BufferAttribute(diskPositions, 3));
    diskGeometry.setAttribute('color', new THREE.BufferAttribute(diskColors, 3));

    const diskPoints = new THREE.Points(diskGeometry, new THREE.PointsMaterial({
      size: 0.045, map: softSprite, vertexColors: true, transparent: true,
      opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
    }));
    diskPoints.rotation.x = Math.PI / 2.6;
    blackholeGroup.add(diskPoints);

    let diskTime = 0;
    function updateBlackhole(dt) {
      diskTime += dt;
      for (let i = 0; i < DISK_COUNT; i++) {
        const a = diskAngle0[i] + diskTime * diskSpeed[i];
        const r = diskRadius[i];
        diskPositions[i*3]     = Math.cos(a) * r;
        diskPositions[i*3 + 1] = diskHeight[i];
        diskPositions[i*3 + 2] = Math.sin(a) * r;
      }
      diskGeometry.attributes.position.needsUpdate = true;
      blackholeGroup.rotation.y += dt * 0.01;
    }

    // ===================== PLANETS =====================
    function makeTerrestrialTexture(base, spots, count) {
      const w = 256, h = 128;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < count; i++) {
        const x = Math.random() * w, y = Math.random() * h;
        const r = 3 + Math.random() * 14;
        ctx.globalAlpha = 0.18 + Math.random() * 0.35;
        ctx.fillStyle = spots[Math.floor(Math.random() * spots.length)];
        ctx.beginPath();
        ctx.ellipse(x, y, r, r * (0.5 + Math.random() * 0.4), Math.random() * Math.PI, 0, Math.PI * 2);
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeBandedTexture(stops) {
      const w = 256, h = 128;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      stops.forEach((col, i) => grad.addColorStop(i / (stops.length - 1), col));
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeSunTexture() {
      const w = 512, h = 256;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffd54f';
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 1400; i++) {
        const x = Math.random() * w, y = Math.random() * h;
        ctx.globalAlpha = 0.2 + Math.random() * 0.35;
        ctx.fillStyle = Math.random() < 0.5 ? '#ff8c28' : '#fff6c8';
        ctx.beginPath();
        ctx.arc(x, y, 1 + Math.random() * 5, 0, Math.PI * 2);
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const planetsGroup = new THREE.Group();
    const sunMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.9, 32, 32),
      new THREE.MeshBasicMaterial({ map: makeSunTexture() })
    );
    planetsGroup.add(sunMesh);
    sunLight.position.set(0, 0, 0);

    const PLANET_DATA = [
      { name: 'Mercury', au: 0.39, size: 0.16, dotColor: '#9c9c9c', fact: 'Closest planet to the Sun and the smallest in the solar system.', tex: () => makeTerrestrialTexture('#9c9c9c', ['#7a7a7a', '#bdbdbd'], 260) },
      { name: 'Venus',   au: 0.72, size: 0.28, dotColor: '#e8cda2', fact: 'The hottest planet — a runaway greenhouse effect traps heat under thick clouds.', tex: () => makeTerrestrialTexture('#e8cda2', ['#d8b878', '#f0e0b8'], 160) },
      { name: 'Earth',   au: 1.00, size: 0.30, dotColor: '#2f6fed', fact: 'The only known planet with life. About 71% of its surface is water.', tex: () => makeTerrestrialTexture('#1c4fa0', ['#2f7d32', '#5a8f3c', '#e8e8e8'], 220) },
      { name: 'Mars',    au: 1.52, size: 0.20, dotColor: '#b1440e', fact: 'The Red Planet, colored by iron oxide dust. Home to Olympus Mons, the tallest volcano.', tex: () => makeTerrestrialTexture('#b1440e', ['#8a3208', '#d97a4a'], 220) },
      { name: 'Jupiter', au: 5.20, size: 0.85, dotColor: '#d8ae76', fact: 'The largest planet. Its Great Red Spot is a storm bigger than Earth.', tex: () => makeBandedTexture(['#a97a4e', '#e3c9a0', '#c9a26a', '#f0dfc0']) },
      { name: 'Saturn',  au: 9.58, size: 0.72, dotColor: '#e3c98f', fact: 'Famous for its spectacular ring system made of ice and rock.', ring: true, tex: () => makeBandedTexture(['#d9c088', '#f2e6c2', '#e8d3a0']) },
      { name: 'Uranus',  au: 19.2, size: 0.48, dotColor: '#9fe3e0', fact: 'Rotates almost on its side, likely from an ancient collision.', tex: () => makeBandedTexture(['#8fd6d3', '#bdf0ee', '#9fe3e0']) },
      { name: 'Neptune', au: 30.1, size: 0.46, dotColor: '#3f5efb', fact: 'The windiest planet, with storms reaching over 2,000 km/h.', tex: () => makeBandedTexture(['#2f4ad0', '#5f7dfc', '#3f5efb']) },
      { name: 'Pluto',   au: 39.5, size: 0.12, dotColor: '#b8a58c', fact: 'A dwarf planet in the Kuiper Belt, with a heart-shaped glacier region.', tex: () => makeTerrestrialTexture('#b8a58c', ['#9c8770', '#cdbba0'], 180) }
    ];

    function orbitRadiusFor(au) {
      return 2.4 + Math.sqrt(au) * 2.0;
    }

    const planets = PLANET_DATA.map((p) => {
      const orbitR = orbitRadiusFor(p.au);
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(p.size, 32, 32),
        new THREE.MeshStandardMaterial({ map: p.tex(), roughness: 0.85, metalness: 0.03 })
      );
      planetsGroup.add(mesh);

      if (p.ring) {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(p.size * 1.4, p.size * 2.2, 48),
          new THREE.MeshBasicMaterial({ color: 0xd8c79a, side: THREE.DoubleSide, transparent: true, opacity: 0.7 })
        );
        ring.rotation.x = Math.PI / 2.3;
        mesh.add(ring);
      }

      const orbitCurve = new THREE.EllipseCurve(0, 0, orbitR, orbitR, 0, Math.PI * 2, false, 0);
      const orbitPts = orbitCurve.getPoints(128).map(pt => new THREE.Vector3(pt.x, 0, pt.y));
      const orbitLine = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(orbitPts),
        new THREE.LineBasicMaterial({ color: 0x33475e, transparent: true, opacity: 0.28 })
      );
      planetsGroup.add(orbitLine);

      return { ...p, mesh, orbitR, angle: Math.random() * Math.PI * 2, speed: 0.35 / Math.sqrt(p.au) };
    });

    function updatePlanets(dt) {
      for (const p of planets) {
        p.angle += dt * p.speed;
        p.mesh.position.set(Math.cos(p.angle) * p.orbitR, 0, Math.sin(p.angle) * p.orbitR);
        p.mesh.rotation.y += dt * 0.6;
      }
      sunMesh.rotation.y += dt * 0.05;
    }

    // Planet Menu UI
    const planetMenuEl = document.getElementById('planetMenu');
    const planetInfoEl = document.getElementById('planetInfo');
    let selectedPlanet = null;

    function buildPlanetMenu() {
      planetMenuEl.innerHTML = '';
      const overviewBtn = document.createElement('button');
      overviewBtn.className = 'planet-btn active';
      overviewBtn.innerHTML = `<span class="planet-dot" style="background:#6ee7ff"></span>Overview`;
      overviewBtn.onclick = () => selectPlanet(null, overviewBtn);
      planetMenuEl.appendChild(overviewBtn);

      planets.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'planet-btn';
        btn.innerHTML = `<span class="planet-dot" style="background:\( {p.dotColor}"></span> \){p.name}`;
        btn.onclick = () => selectPlanet(p, btn);
        planetMenuEl.appendChild(btn);
      });
    }
    buildPlanetMenu();

    function selectPlanet(p, btnEl) {
      selectedPlanet = p;
      document.querySelectorAll('.planet-btn').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');

      if (p) {
        planetInfoEl.style.display = 'block';
        document.getElementById('piName').textContent = p.name;
        document.getElementById('piAu').textContent = `${p.au} AU from the Sun`;
        document.getElementById('piFact').textContent = p.fact;
        requestFocus(p.size * 6 + 2.5);
      } else {
        planetInfoEl.style.display = 'none';
        requestFocus(20);
      }
    }

    // ===================== MODE SWITCHING =====================
    let currentMode = 'galaxy';
    const colorPanelEl = document.getElementById('colorPanel');

    function setMode(mode) {
      currentMode = mode;
      galaxyPoints.visible = mode === 'galaxy';
      blackholeGroup.visible = mode === 'blackhole';
      planetsGroup.visible = mode === 'planets';

      shapeLabel.style.display = mode === 'galaxy' ? 'block' : 'none';
      colorPanelEl.style.display = mode === 'galaxy' ? 'block' : 'none';
      planetMenuEl.style.display = mode === 'planets' ? 'block' : 'none';
      planetInfoEl.style.display = (mode === 'planets' && selectedPlanet) ? 'block' : 'none';

      document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));

      if (mode === 'galaxy') {
        document.getElementById('overlayTitle').textContent = 'Space Explorer';
        document.getElementById('overlaySub').textContent = 'Drag to rotate · Scroll to zoom';
        requestFocus(9);
      } else if (mode === 'blackhole') {
        document.getElementById('overlayTitle').textContent = 'Black Hole';
        document.getElementById('overlaySub').textContent = 'Light bends around the event horizon';
        requestFocus(7);
      } else {
        document.getElementById('overlayTitle').textContent = 'Solar System';
        document.getElementById('overlaySub').textContent = 'Tap a planet to explore';
        requestFocus(20);
      }
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    blackholeGroup.visible = false;
    planetsGroup.visible = false;
    scene.add(blackholeGroup);
    scene.add(planetsGroup);

    // ===================== CAMERA =====================
    let focusTimer = 0, focusDistance = 9;

    function requestFocus(distance) {
      focusDistance = distance;
      focusTimer = 1.4;
    }

    function desiredTarget() {
      if (currentMode === 'planets' && selectedPlanet) return selectedPlanet.mesh.position;
      return new THREE.Vector3(0, 0, 0);
    }

    // Color controls
    const cpCore = document.getElementById('cpCore');
    const cpMid  = document.getElementById('cpMid');
    const cpEdge = document.getElementById('cpEdge');

    function applyColors(core, mid, edge) {
      colorCore = new THREE.Color(core);
      colorMid  = new THREE.Color(mid);
      colorEdge = new THREE.Color(edge);
      regenerateGalaxyColors();
    }

    cpCore.addEventListener('input', () => applyColors(cpCore.value, cpMid.value, cpEdge.value));
    cpMid.addEventListener('input',  () => applyColors(cpCore.value, cpMid.value, cpEdge.value));
    cpEdge.addEventListener('input', () => applyColors(cpCore.value, cpMid.value, cpEdge.value));

    document.querySelectorAll('.cp-swatch').forEach(btn => {
      btn.addEventListener('click', () => {
        const { core, mid, edge } = btn.dataset;
        cpCore.value = core; cpMid.value = mid; cpEdge.value = edge;
        applyColors(core, mid, edge);
      });
    });

    // ===================== ANIMATION LOOP =====================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (currentMode === 'galaxy') updateGalaxy(dt);
      else if (currentMode === 'blackhole') updateBlackhole(dt);
      else updatePlanets(dt);

      const targetOld = controls.target.clone();
      controls.target.lerp(desiredTarget(), currentMode === 'planets' && selectedPlanet ? 0.05 : 0.06);
      camera.position.add(controls.target.clone().sub(targetOld));

      if (focusTimer > 0) {
        focusTimer -= dt;
        const offset = camera.position.clone().sub(controls.target);
        const newDist = THREE.MathUtils.lerp(offset.length(), focusDistance, 0.06);
        camera.position.copy(controls.target).add(offset.setLength(Math.max(newDist, 0.01)));
      }

      controls.update();
      composer.render();
    }

    // ===================== RESIZE & START =====================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    document.getElementById('loading').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
    }, 600);

    shapeLabel.textContent = GALAXY_SHAPES[0].name;
    setMode('galaxy');
    animate();
  </script>
</body>
</html>
